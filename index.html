<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>试卷生成 · 智能题库</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--text:#2c2c2c;--muted:#6b6b6b;--border:#e0ded8;--accent:#2c5f8a;--al:#e8f0f7;--green:#2d7d46;--gb:#edf7f0;--red:#c0392b;--rb:#fef0ef;--purple:#5b3ec4;--pb:#f3f0ff;--orange:#b85c1e;--ob:#fff4ed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
.c{max-width:960px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:21px;text-align:center;margin:20px 0 6px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0}
.tb{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.tb:hover{border-color:var(--accent)}.tb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pn{display:none}.pn.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}
.btn{padding:8px 18px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-family:inherit;outline:none}
.btn:hover{border-color:var(--accent);background:var(--al)}.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.accent:hover{opacity:.9}
.btn.danger{color:var(--red);border-color:var(--red)}.btn.danger:hover{background:var(--rb)}.btn.small{padding:4px 12px;font-size:12px}
input,select,textarea{font-family:inherit;font-size:14px;outline:none;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}
.qt{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.qt.single{color:var(--purple);background:var(--pb)}.qt.multi{color:var(--orange);background:var(--ob)}
.qt.judge{color:var(--green);background:var(--gb)}.qt.subjective{color:#8b4513;background:#fff8f0}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.stat-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;text-align:center;min-width:80px}
.stat-item .num{font-size:24px;font-weight:700;color:var(--accent)}.stat-item .lbl{font-size:12px;color:var(--muted)}
.qlist{max-height:600px;overflow-y:auto}.qitem{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.qitem:last-child{border-bottom:none}.qitem .qi{flex:1;min-width:0}.qitem .qi .qtxt{font-weight:500;word-break:break-all}
.qitem .qi .qmeta{font-size:12px;color:var(--muted);margin-top:4px}.qitem .qact{display:flex;gap:4px;flex-shrink:0}
.qlist-header{padding:0 0 8px 0;border-bottom:1px solid var(--border);margin-bottom:4px}
.qcb{flex-shrink:0;margin-top:3px;width:16px;height:16px;cursor:pointer}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cfg-item{display:flex;flex-direction:column;gap:4px}.cfg-item label{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tag{padding:2px 8px;border-radius:4px;font-size:11px;background:#eee;color:var(--muted);cursor:pointer;user-select:none}
.tag.selected{background:var(--accent);color:#fff}
.pp-card{padding:12px 16px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.pp-card:hover{border-color:var(--accent);background:var(--al)}
.sb{position:sticky;top:52px;z-index:9;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.sb .st{display:flex;gap:16px;font-size:14px}.sb .st strong{color:var(--accent)}
.ph{text-align:center;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ph h2{font-size:17px;margin-bottom:6px}.ph .mt{font-size:13px;color:var(--muted)}
.cd{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:border-color .2s}
.cd.submitted{pointer-events:none}.cd.correct{border-color:var(--green);background:#fcfdf9}.cd.wrong{border-color:var(--red);background:#fefcfc}
.qn{font-weight:700;color:var(--accent);font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.qq{font-size:15px;margin:8px 0 12px;font-weight:500}
.ops{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.op{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;font-size:14px}
.op:hover{border-color:var(--accent)}.op.selected{border-color:var(--accent);background:var(--al)}
.op.correct-answer{border-color:var(--green);background:var(--gb)}.op.wrong-answer{border-color:var(--red);background:var(--rb)}
.opl{font-weight:600;color:var(--muted);min-width:22px}
.exp{margin-top:12px;padding:12px;border-radius:6px;background:#fafaf7;font-size:13px;display:none;border-left:3px solid var(--accent)}
.exp.show{display:block}.exp.correct-exp{border-left-color:var(--green);background:var(--gb)}.exp.wrong-exp{border-left-color:var(--red);background:var(--rb)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;justify-content:center;align-items:flex-start;padding-top:40px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:10px;padding:24px;width:700px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:17px;margin-bottom:16px}.form-group{margin-bottom:12px}.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}.empty{text-align:center;padding:40px 20px;color:var(--muted)}
</style>
</head>
<body>
<div class="c">
<h1>&#x1F4CB; 试卷生成器</h1>
<p class="sub">试卷生成 · 智能题库</p>

<div class="tabs" id="mainTabs">
  <div class="tb active" data-tab="bank">题库管理</div>
  <div class="tb" data-tab="generate">试卷生成</div>
  <div class="tb" data-tab="preview">预览测试</div>
  <div class="tb" data-tab="io">导入导出</div>
</div>

<div class="pn active" id="tab-bank">
  <div class="stats" id="bankStats"></div>
  <div class="row" style="margin-bottom:12px">
    <select id="filterType" onchange="renderBank()"><option value="all">全部类型</option><option value="single">单选题</option><option value="multi">多选题</option><option value="judge">判断题</option><option value="subjective">主观题</option></select>
    <input type="text" id="filterKeyword" placeholder="搜索题目关键词..." oninput="renderBank()">
    <select id="filterTag" onchange="renderBank()" style="max-width:160px"><option value="">全部标签</option></select>
    <button class="btn accent" onclick="openQuestionModal(-1)">＋ 添加题目</button>
    <button class="btn danger" id="btnBatchDelete" style="display:none" onclick="batchDelete()">🗑 批量删除</button>
  </div>
  <div class="card">
    <div class="qlist-header" id="qlistHeader" style="display:none"><label style="font-size:13px;cursor:pointer;user-select:none"><input type="checkbox" id="cbSelectAll" onchange="toggleSelectAll()"> 全选</label><span id="selectedCount" style="font-size:12px;color:var(--muted);margin-left:12px"></span></div>
    <div class="qlist" id="qlist"><div class="empty">暂无题目，点击"添加题目"开始</div></div>
  </div>
</div>

<div class="pn" id="tab-generate">
  <div class="card">
    <h3 style="margin-bottom:12px">组卷配置</h3>
    <div class="cfg-grid">
      <div class="cfg-item"><label>试卷名称前缀</label><input type="text" id="cfgName" value="试卷"></div>
      <div class="cfg-item"><label>生成套数</label><input type="number" id="cfgCount" value="1" min="1" max="20"></div>
      <div class="cfg-item"><label>单选题数</label><input type="number" id="cfgSingle" value="1" min="0" max="100"></div>
      <div class="cfg-item"><label>多选题数</label><input type="number" id="cfgMulti" value="1" min="0" max="50"></div>
      <div class="cfg-item"><label>判断题数</label><input type="number" id="cfgJudge" value="1" min="0" max="30"></div>
      <div class="cfg-item"><label>主观题数</label><input type="number" id="cfgSubjective" value="0" min="0" max="30"></div>
      <div class="cfg-item"><label>试卷副标题</label><input type="text" id="cfgSubtitle" value="试卷"></div>
    </div>
    <div style="margin-top:12px;margin-bottom:8px"><label style="font-size:15px;cursor:pointer;user-select:none;display:inline-flex;white-space:nowrap;align-items:center;gap:6px;background:var(--al);padding:6px 12px;border-radius:6px"><input type="checkbox" id="cfgNoDup" onchange="localStorage.setItem('gk_nodup',this.checked?'1':'')"> 每套试卷题目不重复</label></div>
    <div style="margin-top:12px"><label style="font-size:13px;color:var(--muted);display:block;margin-bottom:4px">选题范围（留空则全选）</label><div class="tags" id="topicTags"></div></div>
    <div class="stats" id="genStats" style="margin-top:12px"></div>
    <div style="margin-top:12px"><button class="btn accent" onclick="generatePapers()">&#x1F3B2; 随机组卷</button></div>
  </div>
  <div id="paperPreview"></div>
</div>

<div class="pn" id="tab-preview"><div id="previewContent"><div class="empty">请先在"试卷生成"中生成试卷</div></div></div>

<div class="pn" id="tab-io">
  <div class="card"><h3 style="margin-bottom:12px">导入题库</h3><p style="font-size:13px;color:var(--muted);margin-bottom:8px">支持导入标准格式的试卷 HTML 文件或 JSON 题库文件。</p><div class="row"><input type="file" id="importFile" accept=".html,.json" onchange="handleImport(event)" style="display:none"><button class="btn" onclick="document.getElementById('importFile').click()">选择文件导入</button></div><div style="margin-top:8px"><a href="https://raw.githubusercontent.com/Simon404Error/paper-generator/main/%E9%A2%98%E5%BA%93%E5%AF%BC%E5%85%A5%E6%A8%A1%E6%9D%BF.json" download style="font-size:13px;color:var(--accent);text-decoration:none">⬇ 下载题库导入模板.json</a></div><div id="importResult" style="margin-top:8px;font-size:13px"></div></div></div>
  <div class="card"><h3 style="margin-bottom:12px">导出</h3><div class="row"><button class="btn accent" onclick="exportJSON()">&#x1F4E6; 导出题库 JSON</button></div></div>
</div>

<div class="modal-overlay" id="questionModal"><div class="modal">
<h3 id="modalTitle">添加题目</h3><input type="hidden" id="editIndex" value="-1">
<div class="form-group"><label>题型</label><select id="qType"><option value="single">单选题</option><option value="multi">多选题</option><option value="judge">判断题</option><option value="subjective">主观题</option></select></div>
<div class="form-group"><label>题目内容</label><textarea id="qText" rows="3" placeholder="输入题目..."></textarea></div>
<div class="form-group" id="optGroup"><label>选项（每行一个）</label><textarea id="qOptions" rows="4" placeholder="A. 选项一&#10;B. 选项二&#10;C. 选项三&#10;D. 选项四"></textarea></div>
<div class="form-group" id="judgeOptGroup" style="display:none"><label>判断题选项固定为：正确 / 错误</label></div>
<div class="form-group" id="subjOptGroup" style="display:none"><label>主观题无选项，请填写参考答案</label></div>
<div class="form-group"><label>正确答案</label><input type="text" id="qAnswer" placeholder="0 或 0,1,2"></div>
<div class="form-group"><label>答案解析</label><textarea id="qExplain" rows="2" placeholder="答案解析..."></textarea></div>
<div class="form-group"><label>知识点标签（可选，逗号分隔）</label><input type="text" id="qTag" placeholder="例如：政治,经济,法律"></div>
<div class="form-actions"><button class="btn" onclick="closeQuestionModal()">取消</button><button class="btn accent" onclick="saveQuestion()">保存</button></div>
</div></div>
</div>
<div class="toast" id="toast"></div>
<script>

var STORE='gk_bank_v2',PAPER_STORE='gk_papers_v2';
var PT={single:'单选题',multi:'多选题',judge:'判断题',subjective:'主观题'};
var LB=['A','B','C','D','E','F','G','H'];

function L(){try{return JSON.parse(localStorage.getItem(STORE))||[];}catch(e){return[];}}
function S(b){localStorage.setItem(STORE,JSON.stringify(b));}
function LP(){try{return JSON.parse(localStorage.getItem(PAPER_STORE))||[];}catch(e){return[];}}
function SP(p){localStorage.setItem(PAPER_STORE,JSON.stringify(p));}

function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2000);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// TABS
document.getElementById('mainTabs').addEventListener('click',function(e){
var tb=e.target.closest('.tb');if(!tb)return;
switchTab(tb.dataset.tab);
try{localStorage.setItem('gk_tab',tb.dataset.tab);}catch(e){}
});

function switchTab(name){
document.querySelectorAll('#mainTabs .tb').forEach(function(t){t.classList.remove('active');});
var el=document.querySelector('#mainTabs .tb[data-tab="'+name+'"]');
if(el)el.classList.add('active');
document.querySelectorAll('.pn').forEach(function(p){p.classList.remove('active');});
document.getElementById('tab-'+name).classList.add('active');
if(name==='bank')renderBank();
if(name==='generate')renderGenerate();
if(name==='preview')renderPreview();
}

function restoreTab(){try{var t=localStorage.getItem('gk_tab');if(t)switchTab(t);var nd=document.getElementById('cfgNoDup');if(nd&&localStorage.getItem('gk_nodup'))nd.checked=true;}catch(e){}}

// BANK
function populateTags(bank){
var sel=document.getElementById('filterTag');if(!sel)return;
sel.innerHTML='<option value="">全部标签</option>';
var tags={};
bank.forEach(function(q){if(q.tag)q.tag.split(/[,，]/).forEach(function(t){t=t.trim();if(t)tags[t]=true;});});
Object.keys(tags).sort().forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
}

function renderBank(){
var bank=L();
var type=document.getElementById('filterType').value;
var kw=document.getElementById('filterKeyword').value.toLowerCase();
var tag=document.getElementById('filterTag').value;
populateTags(bank);
var f=bank;
if(type!=='all')f=f.filter(function(q){return q.s===type;});
if(kw)f=f.filter(function(q){return q.q.toLowerCase().indexOf(kw)>=0||(q.e||'').toLowerCase().indexOf(kw)>=0||(q.tag||'').toLowerCase().indexOf(kw)>=0;});
if(tag)f=f.filter(function(q){if(!q.tag)return false;return q.tag.split(/[,，]/).map(function(t){return t.trim();}).indexOf(tag)>=0;});
var s=bank.filter(function(q){return q.s==='single';}).length;
var m=bank.filter(function(q){return q.s==='multi';}).length;
var j=bank.filter(function(q){return q.s==='judge';}).length;
var z=bank.filter(function(q){return q.s==='subjective';}).length;
document.getElementById('bankStats').innerHTML='<div class="stat-item"><div class="num">'+bank.length+'</div><div class="lbl">题库总数</div></div><div class="stat-item"><div class="num">'+s+'</div><div class="lbl">单选题</div></div><div class="stat-item"><div class="num">'+m+'</div><div class="lbl">多选题</div></div><div class="stat-item"><div class="num">'+j+'</div><div class="lbl">判断题</div></div><div class="stat-item"><div class="num">'+z+'</div><div class="lbl">主观题</div></div>';
var list=document.getElementById('qlist');
if(f.length===0){list.innerHTML='<div class="empty">没有匹配的题目</div>';document.getElementById('qlistHeader').style.display='none';document.getElementById('btnBatchDelete').style.display='none';return;}
var h='';
for(var i=0;i<f.length;i++){
var q=f[i],idx=bank.indexOf(q);
var label=q.s==='judge'?'正确 / 错误':q.s==='subjective'?'主观题':(q.o||[]).join(' / ');
var ans=q.s==='judge'?(q.a[0]===0?'正确':'错误'):q.s==='subjective'?(q.a[0]||'略'):(q.a||[]).map(function(i){return LB[i];}).join('');
h+='<div class="qitem"><input type="checkbox" class="qcb" data-idx="'+idx+'" onchange="updateBatchUI()"><div class="qi"><span class="qt '+q.s+'">'+PT[q.s]+'</span><div class="qtxt">'+esc(q.q)+'</div><div class="qmeta">答案: '+ans+' | '+esc(label)+(q.tag?' | '+esc(q.tag):'')+'</div></div><div class="qact"><button class="btn small" onclick="openQuestionModal('+idx+')">编辑</button><button class="btn small danger" onclick="deleteQuestion('+idx+')">删除</button></div></div>';
}
list.innerHTML=h;
document.getElementById('qlistHeader').style.display='none';
document.getElementById('btnBatchDelete').style.display='none';
document.getElementById('cbSelectAll').checked=false;
}

function updateBatchUI(){
var cbs=document.querySelectorAll('.qcb:checked'),n=cbs.length;
document.getElementById('qlistHeader').style.display=n>0?'block':'none';
document.getElementById('btnBatchDelete').style.display=n>0?'inline-flex':'none';
document.getElementById('selectedCount').textContent=n>0?'已选 '+n+' 题':'';
}
function toggleSelectAll(){var a=document.getElementById('cbSelectAll').checked;document.querySelectorAll('.qcb').forEach(function(cb){cb.checked=a;});updateBatchUI();}
function batchDelete(){
var idxs=[];document.querySelectorAll('.qcb:checked').forEach(function(cb){idxs.push(parseInt(cb.dataset.idx));});
if(idxs.length===0){toast('请先选择题目');return;}
if(!confirm('确定删除 '+idxs.length+' 道题目？'))return;
var bank=L();idxs.sort(function(a,b){return b-a;});idxs.forEach(function(i){bank.splice(i,1);});S(bank);renderBank();toast('已删除 '+idxs.length+' 道');
}
function deleteQuestion(idx){if(!confirm('确定删除？'))return;var b=L();b.splice(idx,1);S(b);renderBank();toast('已删除');}

// MODAL
function openQuestionModal(idx){
var bank=L();
document.getElementById('editIndex').value=idx>=0?idx:-1;
if(idx>=0&&idx<bank.length){
var q=bank[idx];
document.getElementById('modalTitle').textContent='编辑题目';
document.getElementById('qType').value=q.s;
document.getElementById('qText').value=q.q;
document.getElementById('qOptions').value=(q.o||[]).join('\n');
document.getElementById('qAnswer').value=(q.a||[]).join(',');
document.getElementById('qExplain').value=q.e||'';
document.getElementById('qTag').value=q.tag||'';
}else{
document.getElementById('modalTitle').textContent='添加题目';
document.getElementById('qType').value='single';
document.getElementById('qText').value='';
document.getElementById('qOptions').value='';
document.getElementById('qAnswer').value='';
document.getElementById('qExplain').value='';
document.getElementById('qTag').value='';
}
updateOptVis();
document.getElementById('questionModal').classList.add('show');
if(document.getElementById('qType').value==='subjective')document.getElementById('qAnswer').parentNode.style.display='none';
}
function closeQuestionModal(){document.getElementById('questionModal').classList.remove('show');}
document.getElementById('qType').addEventListener('change',updateOptVis);
function updateOptVis(){
var v=document.getElementById('qType').value;
document.getElementById('optGroup').style.display=(v==='single'||v==='multi')?'block':'none';
document.getElementById('judgeOptGroup').style.display=v==='judge'?'block':'none';
document.getElementById('subjOptGroup').style.display=v==='subjective'?'block':'none';
document.getElementById('qAnswer').parentNode.style.display=v==='subjective'?'none':'block';
}
function saveQuestion(){
var idx=parseInt(document.getElementById('editIndex').value);
var type=document.getElementById('qType').value;
var text=document.getElementById('qText').value.trim();
var explain=document.getElementById('qExplain').value.trim();
var tag=document.getElementById('qTag').value.trim();
var ansStr=document.getElementById('qAnswer').value.trim();
if(!text){toast('请输入题目');return;}
var options=[];
if(type==='judge')options=['正确','错误'];
else if(type==='subjective')options=[];
else options=document.getElementById('qOptions').value.split('\n').map(function(s){return s.trim();}).filter(function(s){return s;});
if((type==='single'||type==='multi')&&options.length<2){toast('至少2个选项');return;}
if(!ansStr&&type!=='subjective'){toast('请输入答案');return;}
var answers=(ansStr||'0').split(',').map(function(s){return parseInt(s.trim());}).filter(function(n){return!isNaN(n);});
